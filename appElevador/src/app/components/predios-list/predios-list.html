<div class="predios-container">
  <mat-card
    *ngFor="let predio of predios"
    class="predio-card"
    [class.selected]="predio.id === selectedPredioId"
    (click)="selecionarPredio(predio.id)"
  >
    <mat-card-header>
      <mat-card-title>{{ predio.nome }}</mat-card-title>
      <mat-card-subtitle>{{ predio.cidade }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p><strong>Endereço:</strong> {{ predio.endereco }}</p>
      <p><strong>Elevadores:</strong> {{ predio.qtdElevadores }}</p>
    </mat-card-content>
  </mat-card>
</div>
