<app-header [tipo]="'predio'" (cadastrar)="abrirModalPredio()"></app-header>

<div class="modal" [ngClass]="{'open': isModalOpen}">
  <div class="modal-content">
    <span class="close" (click)="isModalOpen = false">&times;</span>
    <h2>Cadastrar Prédio</h2>
    <form>
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" [(ngModel)]="predio.nome" required>
      </div>

      <div class="form-group">
        <label for="bairro">Bairro:</label>
        <input type="text" name="bairro" [(ngModel)]="predio.bairro" required>
      </div>

      <div class="form-actions">
        <button type="button" mat-raised-button color="primary" (click)="submitForm()">Cadastrar</button>
        <button type="button" class="close-button" (click)="isModalOpen = false">Fechar</button>
      </div>
    </form>
  </div>
</div>
<div class="predios-container">
  <mat-card *ngFor="let predio of predios"
            class="predio-card"
            [class.selected]="predio.id === selectedPredioId"
            (click)="selecionarPredio(predio.id)">
    <mat-card-content>
      <h3>{{ predio.nome }}</h3>
      <p>{{ predio.bairro }}</p>
      <p *ngIf="predio.elevadores && predio.elevadores.length > 0">
        Elevadores: {{ predio.elevadores.length }}
      </p>
      <p *ngIf="!predio.elevadores || predio.elevadores.length === 0">
        Nenhum elevador cadastrado.
      </p>
    </mat-card-content>
  </mat-card>

  <div *ngIf="!predios || predios.length === 0" class="no-predios-message">
    <p>Nenhum prédio encontrado ou houve um erro ao carregar.</p>
    <p>Verifique o console para mais detalhes.</p>
  </div>
</div>
