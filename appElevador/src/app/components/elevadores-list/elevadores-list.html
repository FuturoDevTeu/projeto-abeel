<div class="elevadores-container" *ngIf="predioId !== null">

  <mat-card
    *ngFor="let elevador of elevadores"
    class="elevador-card"
    [class.selected]="elevador.id === selectedElevadorId"
    (click)="selecionarElevador(elevador.id)"
  >
    <mat-card-header>
      <mat-card-title>{{ elevador.nome }}</mat-card-title>
      <mat-card-subtitle>Status: {{ elevador.status }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p><strong>Capacidade:</strong> {{ elevador.capacidade }} pessoas</p>
      <p><strong>Última manutenção:</strong> {{ elevador.ultimaManutencao | date:'dd/MM/yyyy' }}</p>
    </mat-card-content>
  </mat-card>
</div>
